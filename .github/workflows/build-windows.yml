name: Build Windows (.exe)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  exe:
    name: VOR client + License Manager (Inno Setup installer)
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - app: apps/vor_client
            name: VOR
            output: VOR-Setup-x64
          - app: apps/vor_license_manager
            name: VorLicenseManager
            output: VorLicenseManager-Setup-x64
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Rust core (vor_ffi.dll)
        shell: pwsh
        working-directory: core/vor-ffi
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path ..\..\${{ matrix.app }}\windows\runner\Release 2>$null | Out-Null

      - name: Bootstrap Windows project
        shell: pwsh
        working-directory: ${{ matrix.app }}
        run: bash tool/bootstrap_platforms.sh
        env:
          PLATFORMS: windows

      - name: Flutter build windows (release, LTO)
        working-directory: ${{ matrix.app }}
        run: flutter build windows --release

      - name: Stage bundle (app + vor_ffi.dll + xray core + checksums)
        shell: pwsh
        run: |
          $stage = "stage/${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $stage\core | Out-Null
          Copy-Item -Recurse "${{ matrix.app }}\build\windows\x64\runner\Release\*" $stage
          Copy-Item "core\target\x86_64-pc-windows-msvc\release\vor_ffi.dll" "$stage\vor_ffi.dll"
          # xray-core.exe is fetched from the signed XTLS release (vendored at build time)
          $xrayUrl = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Invoke-WebRequest -Uri $xrayUrl -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xraytmp
          Copy-Item xraytmp\xray.exe "$stage\core\xray.exe"
          Copy-Item xraytmp\*.dat "$stage\core\"
          Get-ChildItem $stage -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path.Substring($stage.Length+1))" } | Set-Content "$stage\..\SHA256SUMS.txt"

      - name: Inno Setup installer (.exe)
        shell: pwsh
        run: |
          $iss = "${{ matrix.app }}\packaging\windows-installer.iss"
          ISCC.exe $iss /DAppBase=${{ matrix.name }} /DOutputName=${{ matrix.output }}
        env:
          AppVersion: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            **/${{ matrix.output }}.exe
            **/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
