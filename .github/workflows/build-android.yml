name: Build Android (.apk)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    name: VOR client + License Manager APKs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: apps/vor_client
            name: VOR-v${{ github.ref_name }}
          - app: apps/vor_license_manager
            name: VorLicenseManager-v${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core (.so for 3 ABIs)
        working-directory: core/vor-ffi
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release
          mkdir -p ../../${{ matrix.app }}/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          cp target/aarch64-linux-android/release/libvor_ffi.so ../../${{ matrix.app }}/android/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libvor_ffi.so ../../${{ matrix.app }}/android/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libvor_ffi.so ../../${{ matrix.app }}/android/app/src/main/jniLibs/x86_64/

      - name: Bootstrap Android project (scaffold + VOR patches)
        working-directory: ${{ matrix.app }}
        run: bash tool/bootstrap_platforms.sh
        env:
          PLATFORMS: android

      - name: Decode release keystore (if provided)
        working-directory: ${{ matrix.app }}
        run: |
          if [ -n "${{ secrets.VOR_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.VOR_KEYSTORE_B64 }}" | base64 -d > android/app/vor-release.jks
          fi

      - name: Flutter build APK (release, R8 + resource shrinking)
        working-directory: ${{ matrix.app }}
        run: flutter build apk --release --split-per-abi
        env:
          VOR_KEYSTORE_B64: ${{ secrets.VOR_KEYSTORE_B64 }}
          VOR_KEYSTORE_PASS: ${{ secrets.VOR_KEYSTORE_PASS }}
          VOR_KEY_PASS: ${{ secrets.VOR_KEY_PASS }}
          VOR_KEY_ALIAS: ${{ secrets.VOR_KEY_ALIAS }}

      - name: Verify APK (no debug symbols, signed)
        run: |
          ls -la ${{ matrix.app }}/build/app/outputs/flutter-apk/
          # checksums for the release manifest (§45 artifact verification)
          (cd ${{ matrix.app }}/build/app/outputs/flutter-apk && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-apk
          path: |
            ${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
            ${{ matrix.app }}/build/app/outputs/flutter-apk/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
